name = "sbp-property-app"
compatibility_date = "2024-01-01"

# Build output directory for Cloudflare Pages
pages_build_output_dir = "dist/public"

# Environment variables for the application
[vars]
NODE_ENV = "production"

# Database configuration (will be set in Cloudflare Pages dashboard)
# DATABASE_URL = "your-database-url-here"
# SESSION_SECRET = "your-session-secret-here"

# Supabase configuration (will be set in Cloudflare Pages dashboard)
# VITE_SUPABASE_URL = "your-supabase-url-here"
# VITE_SUPABASE_ANON_KEY = "your-supabase-anon-key-here"